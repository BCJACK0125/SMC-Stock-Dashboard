name: Update SMC Stock Dashboard

on:
  schedule:
    # cron 使用 UTC 時間。台北時間(UTC+8) 18:00 = UTC 10:00。
    # 目前資料週期已改成 4H：這個排程每天只跑一次，抓到的是「當下最新的
    # 4H 收盤資料」，網頁跟警報都只會反映到最近一次 4H 收盤。
    # 若想要更即時（例如每根 4H K 棒收盤就立刻檢查一次），可以把下面
    # 這行改成一天跑多次，例如 "0 2,6,10,14 * * 1-5"（自行對應交易時段）。
    - cron: "0 2,6,10,14 * * 1-5"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點擊執行，方便測試

permissions:
  contents: write   # 需要 write 權限才能把產生的 index.html push 回 repo

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SMC analysis and generate index.html
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: |
          python main.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html backtest_results.json
          git diff --quiet --cached || git commit -m "chore: auto-update SMC dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
