name: Update SMC Stock Dashboard

on:
  schedule:
    # cron 使用 UTC 時間。台北時間(UTC+8) 18:00 = UTC 10:00。
    # 資料週期是日線，所以一天跑一次就夠——台股 13:30 收盤(UTC 05:30)、
    # 美股前一夜已收，這個時間點兩邊的當日 K 棒都已經確定。
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點擊執行，方便測試

permissions:
  contents: write   # 需要 write 權限才能把產生的 index.html push 回 repo

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SMC analysis and generate index.html
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: |
          python main.py

      # index.html 約 300KB，每天 commit 一次的話一年會在 git 歷史裡累積
      # 上百 MB（內嵌的圖表 JSON 每天都不一樣，跨版本幾乎壓不掉）。
      # 所以網頁推到一個「只有單一 commit」的 orphan 分支，每次強制覆蓋，
      # 歷史不累積；體積小又有追蹤價值的 JSON 才留在主分支。
      - name: Commit state files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # alert_state.json 一定要一起 commit，否則每次 runner 都是全新環境、
          # 去重狀態歸零，同一個訊號還是會天天重寄。
          git add backtest_results.json alert_state.json
          git diff --quiet --cached || git commit -m "chore: update backtest + alert state $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Publish dashboard to gh-pages (single-commit branch)
        run: |
          tmp=$(mktemp -d)
          cp index.html "$tmp/"
          touch "$tmp/.nojekyll"
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
